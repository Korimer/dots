# Mango Window Manager Configuration (TOML Format)

# Mindset: SUPER navigates windows, ALT navigates workspaces/meta
[global]
source_optional = ["/etc/mango/specializations.toml"]

numlock_on = false
xkb_rules_layout = "us"

disable_middle_paste = true # button that does nothing...
trackpad_natural_scrolling = true

#multimonitor
scratchpad_cross_monitor = true

# Good combo for trivial window swaps 
tag_gather = true
tag_carousel = true

enable_border_resize = false # disables left-clicking to resize

# I'd love to set these to true (to auto-fullscreen)
# But it results in really annoying resizing artifacts on some apps
no_border_when_single = false
smart_gaps = false


circle_layout = ["scroller", "deck", "tile", "grid"]

[bind.default]
"SUPER                  + r"            =  "spawn,rofi -show drun"
"SUPER                  + q"            =  "spawn,kitty"
"SUPER                  + c"            =  "killclient,"
"SUPER                  + SHIFT         + r"          =  "reload_config,"
"SUPER                  + CTRL          + SHIFT       + DELETE"  =  "quit,"

"ALT                    + comma"        =  "switch_layout,prev"
"ALT                    + period"       =  "switch_layout,next"
"ALT                    + v"            =  "setlayout,vertical_tile"

# Move focus in tag
"SUPER                  + H"            =  "focusdir,left"
"SUPER                  + Left"         =  "focusdir,left"
"SUPER                  + J"            =  "focusdir,down"
"SUPER                  + Down"         =  "focusdir,down"
"SUPER                  + K"            =  "focusdir,up"
"SUPER                  + Up"           =  "focusdir,up"
"SUPER                  + L"            =  "focusdir,right"
"SUPER                  + Right"        =  "focusdir,right"

# Move windows in tag
"SUPER                  + CTRL          + H"          =  "exchange_client,left"
"SUPER                  + CTRL          + Left"       =  "exchange_client,left"
"SUPER                  + CTRL          + J"          =  "exchange_client,down"
"SUPER                  + CTRL          + Down"       =  "exchange_client,down"
"SUPER                  + CTRL          + K"          =  "exchange_client,up"
"SUPER                  + CTRL          + Up"         =  "exchange_client,up"
"SUPER                  + CTRL          + L"          =  "exchange_client,right"
"SUPER                  + CTRL          + Right"      =  "exchange_client,right"

# Move focus between tags
"SUPER                  + SHIFT         + Left"       =  "viewtoleft,0"
"SUPER                  + SHIFT         + Right"      =  "viewtoright,0"
# Move window between tags
"SUPER                  + CTRL          + SHIFT       + Left"    =  "tagtoleft,0"
"SUPER                  + CTRL          + SHIFT       + Right"   =  "tagtoright,0"

# Swap focus between monitors
"ALT                    + SHIFT         + H"          =  "focusmon,left"
"ALT                    + SHIFT         + Left"       =  "focusmon,left"
"ALT                    + SHIFT         + J"          =  "focusmon,down"
"ALT                    + SHIFT         + Down"       =  "focusmon,down"
"ALT                    + SHIFT         + K"          =  "focusmon,up"
"ALT                    + SHIFT         + Up"         =  "focusmon,up"
"ALT                    + SHIFT         + L"          =  "focusmon,right"
"ALT                    + SHIFT         + Right"      =  "focusmon,right"

# Move window between monitors
"ALT                    + CTRL          + SHIFT       + H"       =  "tagmon,left"
"ALT                    + CTRL          + SHIFT       + Left"    =  "tagmon,left"
"ALT                    + CTRL          + SHIFT       + J"       =  "tagmon,down"
"ALT                    + CTRL          + SHIFT       + Down"    =  "tagmon,down"
"ALT                    + CTRL          + SHIFT       + K"       =  "tagmon,up"
"ALT                    + CTRL          + SHIFT       + Up"      =  "tagmon,up"
"ALT                    + CTRL          + SHIFT       + L"       =  "tagmon,right"
"ALT                    + CTRL          + SHIFT       + Right"   =  "tagmon,right"

# Jump focus to tag
"SUPER                  + 1"            =  "view,1,0"
"SUPER                  + 2"            =  "view,2,0"
"SUPER                  + 3"            =  "view,3,0"
"SUPER                  + 4"            =  "view,4,0"
"SUPER                  + 5"            =  "view,5,0"
"SUPER                  + 6"            =  "view,6,0"
"SUPER                  + 7"            =  "view,7,0"
"SUPER                  + 8"            =  "view,8,0"
"SUPER                  + 9"            =  "view,9,0"

# Jump window to tag
"SUPER                  + CTRL          + 1"          =  "tag,1,0"
"SUPER                  + CTRL          + 2"          =  "tag,2,0"
"SUPER                  + CTRL          + 3"          =  "tag,3,0"
"SUPER                  + CTRL          + 4"          =  "tag,4,0"
"SUPER                  + CTRL          + 5"          =  "tag,5,0"
"SUPER                  + CTRL          + 6"          =  "tag,6,0"
"SUPER                  + CTRL          + 7"          =  "tag,7,0"
"SUPER                  + CTRL          + 8"          =  "tag,8,0"
"SUPER                  + CTRL          + 9"          =  "tag,9,0"

# Oneoffs
"SUPER                  + Tab"          =  "togglejump,"
"ALT                    + Tab"          =  "focusstack,prev"
"ALT                    + SHIFT         + Tab"        =  "focusstack,next"

"SUPER                  + g"            =  "toggleglobal,"
"ALT                    + backslash"    =  "togglefloating,"
"SUPER                  + a"            =  "togglemaximizescreen,"
"SUPER                  + f"            =  "togglefullscreen,"
"SUPER                  + SHIFT         + f"          =  "togglefakefullscreen,"
"ALT                    + s"            =  "minimized,"
"ALT                    + SHIFT         + s"          =  "restore_minimized,"
"ALT                    + z"            =  "toggle_scratchpad,"

"ALT                    + e"            =  "set_proportion,1.0"
"ALT                    + x"            =  "switch_proportion_preset,"
"ALT                    + SUPER         + CTRL        + Left"    =  "scroller_stack,left"
"ALT                    + SUPER         + CTRL        + Right"   =  "scroller_stack,right"
"ALT                    + SUPER         + CTRL        + Up"      =  "scroller_stack,up"
"ALT                    + SUPER         + CTRL        + Down"    =  "scroller_stack,down"

"ALT                    + SHIFT         + Return"     =  "dwindle_toggle_split_direction,"

# Mouse Bindings
[mousebind.default]
"SUPER                  + btn_left"     =  "moveresize,curmove"
"SUPER                  + btn_right"    =  "moveresize,curresize"

# Axis / Scroll Bindings
[axisbind.default]
"SUPER                  + UP"           =  "viewtoleft_have_client,"
"SUPER                  + DOWN"         =  "viewtoright_have_client,"

# Gesture Bindings
[gesturebind.default]
"none                   + left          + 3"          =  "focusdir,left"
"none                   + right         + 3"          =  "focusdir,right"
"none                   + up            + 3"          =  "focusdir,up"
"none                   + down          + 3"          =  "focusdir,down"
"none                   + right         + 4"          =  "viewprev_have_client,"
"none                   + left          + 4"          =  "viewnext_have_client,"
"none                   + up            + 4"          =  "enteroverview,"
"none                   + down          + 4"          =  "leaveoverview,"

[[rule.layer_rule]]
animation_type_open     =  "zoom"
layer_name              =  "rofi"

[[rule.layer_rule]]
animation_type_close    =  "zoom"
layer_name              =  "rofi"
